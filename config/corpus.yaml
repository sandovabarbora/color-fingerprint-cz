# Curated corpus of Czech advertising spots for color-fingerprint analysis.
#
# Schema (per entry):
#   id            unique kebab-case identifier (used as filename stem)
#   brand         display name (may repeat across rows; e.g. two McDonald's spots)
#   sector        one of: QSR, Retail, Beverage, Automotive, Banking, Telecom
#   channel_url   YouTube channel to search inside; null = open YouTube search
#   search_query  passed to yt-dlp's `ytsearch1:` resolver (or channel search)
#   expected_year hint for human verification; not used as a filter
#   anchor_hex    brand color anchor for the brand_anchor metric (LAB-distance basis)
#
# Runtime filters (applied in src/fetch.py, not declared here):
#   - duration between 15 and 90 seconds
#   - view_count > 10_000 (proxy for actual campaign vs leaked draft)
#   - public + downloadable (yt-dlp will skip and log WARNING otherwise)

brands:
  - id: mcdonalds_syrova
    brand: McDonald's
    sector: QSR
    channel_url: https://www.youtube.com/@mcdonaldsczech
    search_query: Sýrová sezóna
    expected_year: 2024
    anchor_hex: "#FFC72C"  # golden yellow

