# Brand definitions — one row per brand.
#
# scripts/discover_spots.py walks each channel and writes the discovered
# spots to config/corpus.yaml. corpus.yaml is the operational input that
# the main pipeline reads; brands.yaml is the spec.
#
# Schema:
#   id            kebab-case identifier
#   brand         display name
#   sector        QSR, Retail, Beverage, Automotive, Banking, Telecom,
#                 Energy, Insurance, Furniture
#   channel_url   official YouTube channel
#   anchor_hex    canonical brand color for the brand-color-gap metric

brands:
  - id: mcdonalds
    brand: McDonald's
    sector: QSR
    channel_url: https://www.youtube.com/@mcdonaldsczech
    anchor_hex: "#FFC72C"

