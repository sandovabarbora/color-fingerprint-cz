# Patterns + playbook rendered into outputs/index.html.
#
# Every pattern argues one facet of the central thesis: brand color and
# on-screen color are usually different colors, the split forms two
# camps, and the decision is most often accidental.
#
# The playbook is the so-what: how a strategist or creative director
# decides which camp the next spot belongs to, on purpose.

patterns:
  - title: >-
      Two camps, eight commitments to "world", two commitments to
      "brand color".
    evidence: >-
      Below 20&deg; gap: McDonald's Sýrová sezóna (8&deg;) and Kofola
      MéněVíce (11&deg;). Above 100&deg; gap: seven spots, including
      Mattoni (167&deg;), AAA Auto (159&deg;), T-Mobile Vánoce (153&deg;)
      and Penny Vánoční (138&deg;). One brand straddles, Vodafone
      Vánoční at 49&deg;. The histogram is bimodal, not a continuum.
    takeaway: >-
      A spot is one of two things. A flood of brand color (and the
      product had better be that color). Or a world the brand visits
      with its logo. The middle is rare and usually accidental.

  - title: >-
      The two camps make different creative trades, and pay different
      prices.
    evidence: >-
      Brand-color spots stay tight: Kofola at 14 diversity, McDonald's
      Sýrová at 27, both with anchor share 47% and 48% respectively.
      World-color spots range wider: Mc'n'Roll diversity 27, Mattoni 21,
      AAA Auto 23, with anchor share dropping to 0.001% (AAA), 1%
      (Mattoni), 4% (T-Mobile). The brand-color camp pays in palette
      breadth; the world-color camp pays in brand recall on screen.
    takeaway: >-
      Neither trade is wrong. Both have a price. The choice should be
      a brief decision, not an editorial accident discovered in the cut.

  - title: >-
      The split is structural. Same brand, two spots, two cameras.
    evidence: >-
      McDonald's appears twice in the dendrogram and the two spots
      cluster closer to each other than to anyone else. Sýrová sezóna
      is a brand-color spot (8&deg; gap, yellow on 48% of screen).
      Mc'n'Roll is a world-color spot (106&deg; gap, yellow on 25%).
      Same brand color, same anchor swatch, opposite jobs. The brand's
      identity holds across both; the picture's job does not.
    takeaway: >-
      Brand color is not a constant within a brand. It is a creative
      parameter set per spot. Decide what job the swatch is doing this
      time: hero, accent, or none.

  - title: >-
      Sector predicts the default camp, not the right answer.
    evidence: >-
      Automotive (AAA, 159&deg;) and banking (Fio, 102&deg;) default
      hard to world-color. Telecom (T-Mobile 153&deg;, Vodafone 49&deg;)
      splits. QSR contains both extremes (McDonald's Sýrová 8&deg; vs
      Mc'n'Roll 106&deg;). The category sets the gravity well; the
      brief decides whether to follow it.
    takeaway: >-
      If your category defaults to world-color, a brand-color spot is
      distinctive almost by construction. If your category defaults to
      brand-color, a world-color spot is the bolder counter-position.
      Either move is harder to land without naming it first.

playbook:
  - title: >-
      Decide brand-color or world-color in the brief, not the cut.
    body: >-
      Before greenlight, agree with the client which camp the spot
      belongs to and what the target gap is. Brand-color: target gap
      below 20&deg;, anchor share above 40%. World-color: target gap
      above 100&deg;, anchor share below 10%. The middle (Vodafone's
      49&deg; / 17%) is usually a hedged outcome, not a choice.

  - title: >-
      If brand-color: pick a product whose color IS the brand color.
    body: >-
      Sýrová sezóna works because cheese is yellow. Kofola works because
      the world is warm-brown. Forcing brand-color flood when the
      product fights the swatch (a green logo on a beige insurance ad)
      reads as desperation. If the product cannot carry the color,
      switch camps.

  - title: >-
      If world-color: design the world, let the logo carry the brand.
    body: >-
      AAA Auto's spot lives in 9% mean saturation; the yellow never
      appears in the picture. That is fine; the logo end-card carries
      the brand. Stop chasing "more brand color on screen" as a goal.
      Chase a more deliberately built world instead.

  - title: >-
      Score competitors on the gap axis as the first pitch slide.
    body: >-
      Run this pipeline on the client's three competitors. Show them
      where the category lives on the gap axis. Then name where the
      next spot will land. Distinctiveness becomes a coordinate. Worth
      doing especially in categories where every brand has converged
      (banking, telco, automotive).

  - title: >-
      Score the dailies, not just the finished cut.
    body: >-
      The pipeline runs on rough footage in minutes. If the brief
      committed to brand-color (gap under 20&deg;) and the dailies are
      scoring 80&deg;, you have caught the drift before it is baked
      into the edit. Cheap insurance on expensive shoots.
